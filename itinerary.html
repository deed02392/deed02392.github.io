async function decryptWith(key) {
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(IV) }, key, u8(CT));
  return new TextDecoder().decode(pt);
}
async function show(html) {

}

(async () => {
  const saved = localStorage.getItem(KEY_STORE);
  if (!saved) return;
  try {
    const key = await crypto.subtle.importKey('raw', u8(saved), 'AES-GCM', false, ['decrypt']);
    await show(await decryptWith(key));
  } catch { localStorage.removeItem(KEY_STORE); }
})();

document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg'), btn = document.getElementById('b');
  msg.textContent = ''; btn.disabled = true; btn.textContent = 'Unlocking…';
  try {
    const pass = document.getElementById('p').value.normalize('NFKC');
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u8(SALT), iterations: ITER, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
    const html = await decryptWith(key);
    if (document.getElementById('r').checked) {
      const raw = new Uint8Array(await crypto.subtle.exportKey('raw', key));
      localStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw)));
    }
    await show(html);
  } catch {
    msg.textContent = 'Wrong passphrase.';
    btn.disabled = false; btn.textContent = 'Unlock';
  }
});
</script>
